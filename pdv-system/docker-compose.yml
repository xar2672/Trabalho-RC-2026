version: '3.8'

services:
  frontend:
    image: httpd:alpine
    container_name: pdv_frontend_apache
    ports:
      - "85:80"
    volumes:
      - ./www/frontend:/usr/local/apache2/htdocs/
      - ./logs/apache:/usr/local/apache2/logs/
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./rules:/usr/local/apache2/conf/minhas-regras
    networks:
      - pdv_network
    restart: unless-stopped

  backend:
    image: node:20-alpine
    container_name: pdv_backend_node
    working_dir: /app
    volumes:
      - ./www/backend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3005:3000"
    networks:
      - pdv_network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pdv_cloudflared_tunnel
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    networks:
      - pdv_network
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

  log_viewer:
    image: amir20/dozzle:latest
    container_name: pdv_log_viewer
    ports:
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pdv_network
    restart: unless-stopped

networks:
  pdv_network:
    driver: bridge